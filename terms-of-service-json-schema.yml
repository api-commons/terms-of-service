$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/api-commons/terms-of-service/main/terms-of-service-json-schema.yml
title: API Commons Terms of Service
description: >-
  The machine-readable terms of service of an API — what a consumer may and may not do, how long
  they may cache, whether they may redistribute, what law governs, and how much notice the provider
  gives before changing or terminating. Every value is transcribed verbatim from the provider's
  own terms page.
oneOf:
- title: Terms of Service document
  description: A standalone document, as written to all/<slug>/terms/.
  type: object
  $ref: '#/$defs/document'
- title: TermsOfService properties
  description: One or more apis.yml property envelopes carrying the document under `data`.
  type: array
  minItems: 1
  items:
    $ref: '#/$defs/property'
$defs:
  verbatim:
    type:
    - string
    - 'null'
    minLength: 1
    description: Copied word for word from the page at `url`. The harvester checks every row against
      the fetched page text and drops any row that does not match. Never paraphrased, never synthetic.
  period:
    type:
    - string
    - 'null'
    description: A period copied exactly as written on the page (for example "30 days" or "12
      months"). Never normalized or computed.
  stance:
    type: string
    enum:
    - allowed
    - prohibited
    - conditional
    - unstated
    description: Whether the page permits something. `allowed`, `prohibited` and `conditional`
      each need a verbatim `text`. `unstated` means the page says nothing about it, which is a
      valid result and is never guessed.
  stanceText:
    type: object
    additionalProperties: false
    required:
    - stance
    description: A permission and the verbatim sentence it was read from.
    properties:
      stance:
        $ref: '#/$defs/stance'
      text:
        $ref: '#/$defs/verbatim'
    if:
      properties:
        stance:
          not:
            const: unstated
    then:
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
  textOnly:
    type: object
    additionalProperties: false
    required:
    - text
    description: A clause that is recorded only as the verbatim text it was read from.
    properties:
      text:
        $ref: '#/$defs/verbatim'
  periodText:
    type: object
    additionalProperties: false
    required:
    - period
    - text
    description: A period and the verbatim sentence that states it.
    properties:
      period:
        $ref: '#/$defs/period'
      text:
        $ref: '#/$defs/verbatim'
  summaryText:
    type: object
    additionalProperties: false
    required:
    - summary
    - text
    description: A short label for a clause plus the verbatim clause itself.
    properties:
      summary:
        type: string
        description: A short label for the clause. The label is ours; the `text` is the provider's.
        minLength: 1
      text:
        type: string
        minLength: 1
        description: Copied word for word from the page at `url`. The harvester checks every row
          against the fetched page text and drops any row that does not match. Never paraphrased,
          never synthetic.
  derivation:
    type: object
    additionalProperties: true
    required:
    - synthetic
    - method
    - read
    - tool
    description: How this document was produced. Every business-layer document is harvested from
      the provider's own page; none is generated.
    properties:
      synthetic:
        const: false
        description: Always false. Synthetic or template-filled documents are not published (roadmap#1086).
      method:
        const: harvested
        description: 'Always `harvested`: the page was fetched by code and the model only transcribed
          rows from it.'
      read:
        type: string
        description: The date the page was read (YYYY-MM-DD).
        format: date
      tool:
        type: string
        description: The harvester that produced the document, e.g. engine/business/harvest-business.py.
      model:
        type: string
        description: The model id that transcribed the rows. The model never authors text; it
          only selects it.
  document:
    type: object
    additionalProperties: false
    required:
    - terms_of_service
    - provider
    - aid
    - url
    - source_date
    - x-apis-io-derivation
    description: A Terms of Service document as harvested from one provider page.
    properties:
      terms_of_service:
        type: string
        description: 'Schema version of this document. `terms_of_service: 0.1.0` for this release.'
        pattern: ^\d+\.\d+\.\d+$
      provider:
        type: string
        description: The provider's name as it appears in its apis.yml.
        minLength: 1
      aid:
        type: string
        description: The provider's APIs.io slug (the `all/<slug>` directory and page slug).
        pattern: ^[a-z0-9][a-z0-9-]*$
      url:
        type: string
        description: The page this document was read from.
        format: uri
      source_date:
        type: string
        description: When the page was read (YYYY-MM-DD).
        format: date
      x-apis-io-derivation:
        $ref: '#/$defs/derivation'
      effective_date:
        type:
        - string
        - 'null'
        description: The effective or last-updated date as written on the page.
      permitted_use:
        type: array
        description: Uses the terms explicitly permit (ODRL permission).
        items:
          $ref: '#/$defs/summaryText'
      prohibited_use:
        type: array
        description: Uses the terms explicitly prohibit (ODRL prohibition).
        items:
          $ref: '#/$defs/summaryText'
      caching:
        description: Whether responses may be cached, and for how long.
        anyOf:
        - type: 'null'
        - type: object
          required:
          - stance
          additionalProperties: false
          properties:
            stance:
              $ref: '#/$defs/stance'
            max_duration:
              $ref: '#/$defs/period'
            text:
              $ref: '#/$defs/verbatim'
          if:
            properties:
              stance:
                not:
                  const: unstated
          then:
            required:
            - text
            properties:
              text:
                type: string
                minLength: 1
      redistribution:
        description: Whether API responses may be redistributed to third parties.
        anyOf:
        - $ref: '#/$defs/stanceText'
        - type: 'null'
      attribution:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: Whether the terms require attribution.
        properties:
          required:
            type:
            - boolean
            - 'null'
            description: True when attribution is required. `null` when the page does not say.
          text:
            $ref: '#/$defs/verbatim'
      governing_law:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: The jurisdiction whose law governs the terms.
        properties:
          jurisdiction:
            type:
            - string
            - 'null'
            description: The jurisdiction as named on the page (e.g. "State of California").
          text:
            $ref: '#/$defs/verbatim'
      liability_cap:
        description: The limitation-of-liability clause, verbatim.
        anyOf:
        - $ref: '#/$defs/textOnly'
        - type: 'null'
      termination_notice:
        description: Notice the provider gives before terminating access.
        anyOf:
        - $ref: '#/$defs/periodText'
        - type: 'null'
      change_notice:
        description: Notice the provider gives before changing the terms.
        anyOf:
        - $ref: '#/$defs/periodText'
        - type: 'null'
      rate_or_usage_limits_referenced:
        description: Where the terms reference rate or usage limits (see the RateLimits property
          for the limits themselves).
        anyOf:
        - $ref: '#/$defs/textOnly'
        - type: 'null'
    patternProperties:
      ^x-:
        description: Extensions.
  property:
    type: object
    additionalProperties: false
    required:
    - type
    - url
    - data
    description: The TermsOfService property as it appears inside an apis.yml / apis.json index.
    properties:
      name:
        type: string
        description: The name of the property as it appears in the index.
      type:
        const: TermsOfService
        description: The API Commons property type. Always TermsOfService.
      description:
        type: string
        description: What this property covers.
      url:
        type: string
        description: The artifact path (or provider page) this property points at.
        format: uri-reference
      source_date:
        type: string
        description: The date the data was last verified against the provider page.
        format: date
      data:
        $ref: '#/$defs/document'
